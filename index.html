<style>
:root{--blue:#1d3f93;--blue2:#3158be;--ink:#23272f;--muted:#6d7480;--line:#d9dde5;--soft:#f4f6fa;--green:#1b8d67;--amber:#a66b00}*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:var(--ink);font:14px Arial,Helvetica,sans-serif}.shell{min-height:100vh;padding:32px 24px 88px}.page{max-width:1220px;margin:auto;background:#fff;box-shadow:0 10px 35px #19233b21;min-height:760px}.topbar{height:52px;background:#173675;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px}.topbar b{font-size:15px}.content{padding:24px 28px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7b8494}.record-title{font-size:22px;margin:5px 0 18px}.context{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:17px;color:#4e5664}.context span{display:flex;gap:6px}.context strong{color:#252b35}.wizard{margin:23px auto 0;max-width:1160px;border:1px solid #d8dce5;border-radius:6px;overflow:hidden;background:#fff}.wizard-head{background:linear-gradient(90deg,#193a84,#3157bb);color:#fff;padding:16px 22px;font-weight:bold;font-size:16px}.steps{display:flex;border-bottom:1px solid var(--line);background:#fff;overflow:auto}.step{flex:1;min-width:135px;padding:12px 10px;display:flex;gap:8px;align-items:center;color:#7b8290;font-size:12px;border-right:1px solid #edf0f4}.step .n{border-radius:50%;width:22px;height:22px;background:#8b929f;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:bold}.step.done{color:#2d3b55}.step.done .n,.step.active .n{background:var(--blue2)}.step.active{color:var(--ink);font-weight:bold}.step.active .n{box-shadow:0 0 0 3px #dce5ff}.panel{padding:24px 26px}.screen-title{font-size:20px;margin:0 0 5px}.screen-sub{color:var(--muted);margin:0 0 20px}.intro-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.choice-card{border:1px solid var(--line);border-radius:8px;padding:18px;background:#fff;cursor:pointer}.choice-card:hover,.choice-card.selected{border-color:var(--blue2);box-shadow:0 0 0 2px #dbe4ff}.choice-card h3{margin:0 0 7px;font-size:15px}.choice-card p{margin:0;color:var(--muted);line-height:1.4}.choice-card small{display:block;margin-top:12px;color:var(--blue);font-weight:bold}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{border:1px solid var(--line);padding:13px;border-radius:5px;background:#fafbfc}.field label{display:block;color:#727a88;font-size:11px;text-transform:uppercase;margin-bottom:6px}.field strong{font-size:14px}.info{background:#eef5ff;border-left:3px solid var(--blue2);padding:11px 13px;color:#34425d;margin:16px 0;line-height:1.4}.or-tabs{display:flex;gap:6px;margin-bottom:12px}.or-tab{border:1px solid #cfd5e0;padding:9px 13px;background:#f5f7fa;font-weight:bold;border-radius:4px}.or-tab.active{background:var(--blue2);border-color:var(--blue2);color:#fff}.table-wrap{border:1px solid #c9cfda;overflow:auto;max-height:360px}.task-table{border-collapse:collapse;width:100%;min-width:770px}.task-table th{background:#f2f4f8;font-size:11px;text-transform:uppercase;color:#5f6875;text-align:left;padding:11px 9px;border-bottom:2px solid #cad2df}.task-table td{padding:12px 9px;border-bottom:1px solid #dfe3ea;vertical-align:middle}.task-table tr.selected{background:#f1f5ff}.task-name{font-weight:bold;max-width:270px}.price{white-space:nowrap;font-weight:bold}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:bold;background:#edf0f5;color:#5d6674}.pill.blue{background:#e2eaff;color:#244ea7}.pill.green{background:#dcf5eb;color:#177553}.pill.amber{background:#fff1d0;color:#8a5a00}.type-select{border:1px solid #cfd5df;border-radius:4px;padding:6px;background:#fff;font-size:12px}.task-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.task-card{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff}.task-card.selected{border-color:var(--blue2);box-shadow:0 0 0 2px #dae4ff}.task-top{display:flex;justify-content:space-between;gap:8px}.task-top h3{font-size:15px;margin:0 0 5px}.task-card p{color:var(--muted);margin:8px 0;line-height:1.35}.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef0f4;padding-top:12px;margin-top:12px}.split{display:grid;grid-template-columns:1fr 305px;gap:18px}.split-list{display:flex;flex-direction:column;gap:8px}.split-item{border:1px solid var(--line);border-radius:7px;padding:13px;display:grid;grid-template-columns:25px 1fr auto;gap:10px;align-items:start}.split-item.selected{border-color:var(--blue2);background:#f5f8ff}.split-item h3{margin:0 0 3px;font-size:14px}.split-item p{margin:0;color:var(--muted);font-size:12px}.summary{border:1px solid #cbd4e8;border-radius:8px;background:#f5f7fc;padding:16px;height:max-content;position:sticky;top:15px}.summary h3{margin:0 0 14px}.sum-line,.review-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #dde3ef}.sum-total{display:flex;justify-content:space-between;font-size:17px;font-weight:bold;padding-top:13px}.media-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.media-chip{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:#fafbfc;display:flex;gap:8px;align-items:center}.send-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.send-option{border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer}.send-option.selected{border-color:var(--blue2);box-shadow:0 0 0 2px #dbe4ff}.send-option h3{margin:0 0 7px}.send-option p{margin:0;color:var(--muted);line-height:1.4}.channel-options{display:flex;gap:10px;margin-top:14px}.channel{border:1px solid var(--line);padding:10px 14px;border-radius:6px;background:#fff;cursor:pointer}.channel.selected{border-color:var(--blue2);background:#edf2ff;font-weight:bold}.review{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}.actions{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}button{border:0;border-radius:5px;padding:10px 16px;font-weight:bold;cursor:pointer}.btn-primary{background:var(--blue2);color:#fff}.btn-secondary{background:#edf0f5;color:#334052}.status{font-size:12px;color:var(--muted);margin-top:12px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202a3d;color:#fff;border-radius:999px;padding:8px 12px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 26px #11182755;z-index:5}.switcher button{background:#3b4a68;color:#fff;padding:7px 11px;border-radius:50%}.switcher strong{min-width:210px;text-align:center;font-size:12px}.prototype-tag{position:fixed;top:12px;right:16px;background:#fdf0d5;color:#77520c;border:1px solid #ebcf8a;padding:6px 9px;border-radius:4px;font-size:10px;font-weight:bold;z-index:6}@media(max-width:800px){.shell{padding:0}.page{min-height:100vh}.content{padding:16px}.intro-grid,.field-grid,.send-grid,.task-cards,.split{grid-template-columns:1fr}.steps .step{min-width:115px}.summary{position:static}.switcher strong{min-width:150px}}
.radio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.radio-card{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:15px;background:#fff;cursor:pointer}.radio-card:hover,.radio-card.selected{border-color:var(--blue2);box-shadow:0 0 0 2px #dbe4ff}.radio-card input{margin-top:3px}.radio-card h3{margin:0 0 5px;font-size:15px}.radio-card p{margin:0;color:var(--muted);line-height:1.35}.radio-card small{display:block;margin-top:9px;color:var(--blue);font-weight:bold}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode-card{border:1px solid var(--line);border-radius:8px;padding:18px;background:#fff;cursor:pointer}.mode-card:hover,.mode-card.selected{border-color:var(--blue2);box-shadow:0 0 0 2px #dbe4ff}.mode-card h3{margin:0 0 7px;font-size:16px}.mode-card p{margin:0;color:var(--muted);line-height:1.4}.mode-card .mode-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.locked{opacity:.58;cursor:not-allowed}.mode-banner{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid #cbd4e8;border-radius:7px;background:#f5f7fc;padding:12px 14px;margin-bottom:14px}.mode-banner strong{color:var(--blue)}.mode-banner span{color:var(--muted);font-size:12px}.full-doc-note{background:#f7f8fb;border-left:3px solid #8a93a3;padding:11px 13px;color:#4b5563;margin:16px 0;line-height:1.4}@media(max-width:800px){.radio-grid,.mode-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="prototype-tag">PROTOTIPO · NO PRODUCCIÓN</div>
<main class="shell"><section class="page"><header class="topbar"><b>BMW Portal Posventa</b><span>EXPEDIENTE · 2542NCS-00008-01</span><span>Gonzalo Zapatero de Murga</span></header><div class="content"><div class="eyebrow">Expediente 2542NCS · wizard de autorización</div><h1 class="record-title">Generar autorización de trabajos</h1><div class="context"><span><strong>Cliente:</strong> Julio Baragaño</span><span><strong>Vehículo:</strong> X1 XDRIVE25E · 2542 NCS</span><span><strong>OR:</strong> 26OR014567</span></div><section class="wizard"><div class="wizard-head">Generar</div><nav class="steps" id="steps"></nav><div class="panel" id="panel"></div></section></div></section></main>
<script>
const docs={or:{label:'Orden de reparación',desc:'Documento principal de la visita y trabajos.'},upsell:{label:'Upselling',desc:'Trabajos adicionales propuestos después de la OR inicial.'},bsi:{label:'BSI',desc:'Documento de mantenimiento incluido en el servicio.'},teleservice:{label:'Teleservice',desc:'Autorización asociada a servicios Teleservice.'},cession:{label:'Contrato de cesión',desc:'Documento contractual de cesión de vehículo o servicio.'}};
let doc='or',mode='partial',step=0,channel='viafirma',send='email';
const tasks=[{id:'t1',name:'Ruido al girar el volante',type:'Tarea',price:287.58,selected:true,required:true,media:['Vídeo inspección dirección']},{id:'t2',name:'Revisión de pastillas de freno',type:'Recomendación',price:182.40,selected:false,required:false,media:['Foto desgaste pastillas']},{id:'t3',name:'Cambio de escobillas delanteras',type:'Campaña',price:74.90,selected:false,required:false,media:['Vídeo escobillas']},{id:'t4',name:'Alineación de dirección',type:'Mano de obra',price:96.25,selected:false,required:false,media:[]}];
const media=[{id:'m1',name:'Vídeo inspección dirección',scope:'Tarea 1',checked:true},{id:'m2',name:'Foto desgaste pastillas',scope:'Tarea 2',checked:false},{id:'m3',name:'Vídeo presentación campaña',scope:'Propuesta',checked:false}];
const euro=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'}),selected=()=>tasks.filter(t=>t.selected),total=()=>selected().reduce((a,t)=>a+t.price,0),docLabel=()=>docs[doc].label;
function screens(){return doc==='upsell'?['document','vehicle','client','work','send']:['document','mode','vehicle','client','work','send']}
function renderSteps(){const names=screens().map(s=>({document:'Documento',mode:'Autorización',vehicle:'Datos del vehículo',client:'Datos del cliente',work:'Trabajos',send:'Envío'})[s]);document.getElementById('steps').innerHTML=names.map((n,i)=>'<div class="step '+(i<step?'done ':'')+(i===step?'active':'')+'"><span class="n">'+(i<step?'✓':i+1)+'</span><span>'+n+'</span></div>').join('')}
function taskToggle(id){const t=tasks.find(x=>x.id===id);t.selected=!t.selected;render()}function typeChange(id,v){tasks.find(x=>x.id===id).required=v==='Obligatoria';render()}
function addMedia(id){const t=tasks.find(x=>x.id===id);const candidate=media.find(m=>!t.media.includes(m.name));if(candidate){t.media.push(candidate.name);candidate.checked=true}render()}
function taskRows(){return tasks.map(t=>'<tr class="'+(t.selected?'selected':'')+'"><td><input type="checkbox" '+(t.selected?'checked':'')+' onchange="taskToggle(\''+t.id+'\')"></td><td><span class="pill '+(t.type==='Campaña'?'amber':'blue')+'">'+t.type+'</span></td><td class="task-name">'+t.name+'</td><td>1</td><td class="price">'+euro(t.price)+'</td><td>'+(mode==='full'?'<span class="pill green">Obligatoria</span>':'<select class="type-select" onchange="typeChange(\''+t.id+'\',this.value)"><option '+(t.required?'selected':'')+'>Obligatoria</option><option '+(!t.required?'selected':'')+'>Opcional</option></select>')+'</td><td><div class="media-cell">'+(t.media.length?'<span class="pill green">'+t.media.length+' MM</span>':'<span class="pill">Sin MM</span>')+'<button class="media-add" onclick="event.stopPropagation();addMedia(\''+t.id+'\')">Añadir</button></div></td></tr>').join('')}
function documentScreen(){return '<h2 class="screen-title">¿Qué documento quieres enviar?</h2><p class="screen-sub">Selecciona el documento que inicia el proceso de autorización.</p><div class="radio-grid">'+Object.entries(docs).map(([id,x])=>'<label class="radio-card '+(doc===id?'selected':'')+'"><input type="radio" name="doc" '+(doc===id?'checked':'')+' onchange="doc=\''+id+'\';mode=\''+(id==='or'||id==='upsell'?'partial':'full')+'\';render()"><span><h3>'+x.label+'</h3><p>'+x.desc+'</p><small>'+(doc===id?'Seleccionado':'Seleccionar')+'</small></span></label>').join('')+'</div><div class="info"><b>Escenario:</b> OR mantiene la elección entre documento completo y trabajos individuales. <b>Upselling se inicia siempre como trabajos individuales</b> para conservar la trazabilidad entre vídeo, tarea, precio y resultado.</div>'}
function modeScreen(){const partial=doc==='or'||doc==='upsell';return '<h2 class="screen-title">¿Cómo quieres autorizarlo?</h2><p class="screen-sub">Elige entre mantener el proceso actual o pedir una decisión por trabajo.</p><div class="mode-grid"><article class="mode-card '+(mode==='full'?'selected':'')+'" onclick="mode=\'full\';tasks.forEach(t=>t.selected=true);channel=\'viafirma\';render()"><h3>Autorizar documento completo</h3><p>El cliente autoriza el documento como hasta ahora. Puedes decidir qué trabajos entran, pero todos los incluidos serán obligatorios.</p><div class="mode-meta"><span class="pill blue">Proceso actual</span><span class="pill">Viafirma</span></div></article><article class="mode-card '+(!partial?'locked ':'')+(mode==='partial'?'selected':'')+'" onclick="'+(partial?"mode='partial';render()":'')+'"><h3>Firmar trabajos individualmente</h3><p>El cliente decide sobre cada línea de trabajo. Permite aceptar una parte y rechazar otra.</p><div class="mode-meta"><span class="pill green">Nuevo proceso</span><span class="pill">Viafirma</span>'+(partial?'<span class="pill">MyBMW APP</span>':'')+'</div></article></div>'+(partial?'':'<div class="full-doc-note"><b>Disponible para este documento:</b> el proceso parcial se habilita cuando el documento contiene trabajos elegibles de OR o upselling.</div>')+'<div class="info"><b>'+docLabel()+':</b> los pasos de vehículo y cliente son comunes. La pantalla de trabajos también se reutiliza.</div>'}
function vehicleScreen(){return '<h2 class="screen-title">Datos del vehículo</h2><p class="screen-sub">Confirma los datos antes de configurar la autorización.</p><div class="field-grid"><div class="field"><label>Matrícula</label><strong>2542 NCS</strong></div><div class="field"><label>VIN</label><strong>WBA21EF0605273809</strong></div><div class="field"><label>Modelo</label><strong>X1 XDRIVE25E</strong></div><div class="field"><label>Documento</label><strong>'+docLabel()+'</strong></div></div><div class="info">Estos datos proceden del expediente y no se editan desde este wizard.</div>'}
function clientScreen(){return '<h2 class="screen-title">Datos del cliente</h2><p class="screen-sub">Confirma el destinatario de la autorización.</p><div class="field-grid"><div class="field"><label>Cliente</label><strong>Julio Baragaño</strong></div><div class="field"><label>Documento</label><strong>00387096Y</strong></div><div class="field"><label>Email</label><strong>julio.baragano@example.com</strong></div><div class="field"><label>Teléfono</label><strong>+34 620 406 516</strong></div></div><div class="info">El cliente ya tiene firmada la OR inicial. Esta autorización se registrará como proceso independiente.</div>'}
function workScreen(){return '<div class="mode-banner"><strong>'+docLabel()+' · '+(mode==='full'?'Documento completo':'Trabajos individuales')+'</strong><span>'+(mode==='full'?'Selecciona qué trabajos entran en el documento; todos los incluidos serán obligatorios.':'Selecciona las tareas que quieres incluir y qué decisión podrá tomar el cliente.')+'</span></div><h2 class="screen-title">Seleccionar trabajos y multimedia</h2><p class="screen-sub">Elige las líneas que formarán parte de la autorización y añade el vídeo o foto que corresponda a cada tarea.</p><div class="or-tabs"><button class="or-tab active">26OR014567</button><button class="or-tab">26OR014568</button></div><div class="table-wrap"><table class="task-table"><thead><tr><th>Incluir</th><th>Tipo</th><th>Descripción</th><th>Cantidad</th><th>Precio IVA incluido</th><th>'+(mode==='full'?'Autorización':'Decisión cliente')+'</th><th>Multimedia por tarea</th></tr></thead><tbody>'+taskRows()+'</tbody></table></div><div class="media-row">'+media.map(m=>'<span class="media-chip"><span>◉</span>'+m.name+'<span class="pill">'+m.scope+'</span></span>').join('')+'</div><div class="'+(mode==='full'?'full-doc-note':'info')+'"><b>'+(mode==='full'?'Documento completo:':'Cómo funciona:')+'</b> '+(mode==='full'?'las líneas marcadas como incluir se envían en el documento y todas quedan como obligatorias para el cliente.':'las tareas obligatorias deben autorizarse para completar el proceso; las opcionales pueden rechazarse individualmente.')+'</div>'}
function sendScreen(){const partial=mode==='partial';return '<h2 class="screen-title">Opción de envío</h2><p class="screen-sub">Elige cómo recibirá y autorizará el cliente '+(partial?'los trabajos':'el documento')+'.</p><div class="send-grid"><article class="send-option '+(channel==='mybmw'?'selected':'')+' '+(partial?'':'locked')+'" onclick="'+(partial?"channel='mybmw';render()":'')+'"><h3>MyBMW APP</h3><p>Aceptación operativa por work orders dentro del thread del expediente.</p><div class="channel-options"><span class="pill green">'+(partial?'Disponible para trabajos individuales':'No disponible para documento completo')+'</span></div></article><article class="send-option '+(channel==='viafirma'?'selected':'')+'" onclick="channel=\'viafirma\';render()"><h3>Viafirma</h3><p>Firma eIDAS 2 con sellado temporal y evidencia completa.</p><div class="channel-options"><button class="channel '+(send==='email'?'selected':'')+'" onclick="event.stopPropagation();send=\'email\';render()">Email</button><button class="channel '+(send==='sms'?'selected':'')+'" onclick="event.stopPropagation();send=\'sms\';render()">SMS</button></div></article></div><div class="review"><div class="review-row"><span>Documento</span><strong>'+docLabel()+'</strong></div><div class="review-row"><span>Modo</span><strong>'+(mode==='full'?'Documento completo':'Trabajos individuales')+'</strong></div><div class="review-row"><span>Trabajos</span><strong>'+selected().length+' · '+euro(total())+'</strong></div><div class="review-row"><span>Canal</span><strong>'+(channel==='viafirma'?'Viafirma · '+send.toUpperCase():'MyBMW APP')+'</strong></div></div>'}
function render(){const current=screens()[step];renderSteps();const body=current==='document'?documentScreen():current==='mode'?modeScreen():current==='vehicle'?vehicleScreen():current==='client'?clientScreen():current==='work'?workScreen():sendScreen();document.getElementById('panel').innerHTML=body+'<div class="actions"><button class="btn-secondary" onclick="prev()" '+(step===0?'disabled':'')+'>Atrás</button><button class="btn-primary" onclick="next()">'+(step===screens().length-1?'Enviar autorización':'Continuar')+'</button></div><div class="status">Prototipo interactivo · Variante A · Estado en memoria · '+docLabel()+' · '+(mode==='full'?'Documento completo':'Trabajos individuales')+'</div>'}
function next(){if(step<screens().length-1){step++;render()}else{document.getElementById('panel').insertAdjacentHTML('afterbegin','<div class="info"><b>Propuesta creada en modo prototipo.</b> Estado: pendiente. El cliente recibiría la notificación por el canal seleccionado.</div>')}}function prev(){if(step>0){step--;render()}}
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next()});render();
</script></body></html>
